<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whaler</title>
  <style>
    /* The front door: choose which version of the game to play. */
    html, body { margin: 0; min-height: 100%; background: #0d2f42; color: #ece2cc;
      font-family: Georgia, "Times New Roman", serif; }
    main { max-width: 760px; margin: 0 auto; padding: 12vh 16px 40px; text-align: center; }
    h1 { font-weight: normal; letter-spacing: 0.3em; margin: 0 0 6px; font-size: 2.2rem; }
    p.lead { color: #a9a08c; font-style: italic; margin: 0 0 40px; }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    a.choice { display: block; text-decoration: none; color: inherit; text-align: left;
      background: rgba(13, 25, 37, 0.8); border: 1px solid rgba(212, 175, 105, 0.38);
      border-radius: 12px; padding: 22px 24px; transition: transform .15s, border-color .15s; }
    a.choice:hover { transform: translateY(-2px); border-color: #e0b252; }
    a.choice h2 { margin: 0 0 8px; font-weight: normal; color: #e0b252; font-size: 1.3rem; }
    a.choice p { margin: 0; color: #cfc5ae; line-height: 1.5; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>WHALER</h1>
    <p class="lead">Choose a version.</p>
    <div class="choices">
      <a class="choice" href="original.html">
        <h2>Original</h2>
        <p>The version built so far: the ship on paper, her rig, the chart and the owners.</p>
      </a>
      <a class="choice" href="new/">
        <h2>New approach</h2>
        <p>An isometric sea. Leave port, find whales, fill the hold, come home.</p>
      </a>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship</title>
  <style>
    html, body { height: 100%; margin: 0; background: #1d3b4f; overflow: hidden; }
    canvas { display: block; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #e8dfc8;
    }
    #canvas-panel {
      position: fixed; top: 1.2rem; left: 1.2rem;
      padding: 0.85rem 1.1rem 0.7rem;
      background: rgba(12, 26, 34, 0.62);
      border: 1px solid rgba(232, 223, 200, 0.22);
      user-select: none; pointer-events: none;
    }
    #canvas-panel h2 {
      margin: 0 0 0.5rem; font-size: 0.72rem; font-weight: normal;
      letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.6;
    }
    #canvas-panel table { border-collapse: collapse; font-size: 0.92rem; }
    #canvas-panel td { padding: 0.12rem 0 0.12rem 0; }
    #canvas-panel .name { padding-right: 1.4rem; }
    #canvas-panel .state { padding-right: 1.4rem; color: #cfe3c8; }
    #canvas-panel .state.reefed { color: #e8c98a; }
    #canvas-panel .state.furled { color: #9aa6ac; }
    #canvas-panel .key { opacity: 0.45; font-size: 0.8rem; }
    #canvas-panel .note {
      margin: 0.7rem 0 0; font-size: 0.78rem; opacity: 0.5; line-height: 1.5;
    }
    #instruments {
      position: fixed; bottom: 1.2rem; right: 1.2rem;
      display: flex; align-items: center; gap: 1rem;
      padding: 0.8rem 1.1rem;
      background: rgba(12, 26, 34, 0.62);
      border: 1px solid rgba(232, 223, 200, 0.22);
      user-select: none; pointer-events: none;
    }
    #instruments dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 0.16rem 1rem; }
    #instruments dt {
      font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase;
      opacity: 0.5; align-self: baseline;
    }
    #instruments dd { margin: 0; font-size: 0.92rem; }
    #instruments dd.stalled { color: #e0a17e; }
    .dial-face { fill: rgba(232, 223, 200, 0.05); stroke: rgba(232, 223, 200, 0.3); stroke-width: 1.5; }
    .dial-north { stroke: rgba(232, 223, 200, 0.55); stroke-width: 2.5; }
    .dial-hull { fill: rgba(232, 223, 200, 0.72); }
    .arrow-shaft { stroke: #7fc0d8; stroke-width: 3; }
    .arrow-head { fill: #7fc0d8; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

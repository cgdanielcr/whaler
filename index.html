<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship</title>
  <style>
    html, body { height: 100%; margin: 0; background: #1d3b4f; overflow: hidden; }
    canvas { display: block; }
    body { font-family: Georgia, "Times New Roman", serif; color: #e8dfc8; }

    .board {
      position: fixed;
      padding: 0.8rem 1.05rem;
      background: rgba(12, 26, 34, 0.62);
      border: 1px solid rgba(232, 223, 200, 0.22);
      user-select: none; pointer-events: none;
    }
    .board h2 {
      margin: 0 0 0.5rem; font-size: 0.7rem; font-weight: normal;
      letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.55;
    }

    #canvas-board { top: 1.1rem; left: 1.1rem; }
    #canvas-board table { border-collapse: collapse; font-size: 0.9rem; }
    #canvas-board td { padding: 0.1rem 0; }
    #canvas-board .name { padding-right: 1.3rem; }
    #canvas-board .state { padding-right: 1.3rem; color: #cfe3c8; min-width: 7.6rem; }
    #canvas-board .state.reefed { color: #e8c98a; }
    #canvas-board .state.furled { color: #9aa6ac; }
    #canvas-board .state.working { color: #8fd0e8; font-style: italic; }
    #canvas-board .key { opacity: 0.42; font-size: 0.78rem; }
    #canvas-board .note {
      margin: 0.7rem 0 0; font-size: 0.76rem; opacity: 0.48; line-height: 1.6;
    }

    #orders-board { bottom: 1.1rem; left: 1.1rem; width: 25rem; max-height: 62vh; overflow-y: auto; }
    #orders-board ul { margin: 0; padding: 0; list-style: none; font-size: 0.88rem; }
    #orders-board li { margin-bottom: 0.4rem; display: grid; grid-template-columns: 1fr auto; gap: 0 0.8rem; }
    #orders-board li.idle, #orders-board li.held { opacity: 0.5; }
    #orders-board .left { font-size: 0.8rem; opacity: 0.7; }
    #orders-board .bar {
      grid-column: 1 / -1; height: 3px; margin-top: 0.22rem;
      background: rgba(232, 223, 200, 0.16);
    }
    #orders-board .bar i { display: block; height: 100%; background: #8fd0e8; }
    #orders-board .post {
      grid-column: 1 / -1; font-size: 0.74rem; line-height: 1.45; opacity: 0.62;
      margin-top: 0.2rem;
    }
    #orders-board .post b { font-weight: normal; color: #8fd0e8; opacity: 0.85; }
    #orders-board .hands {
      margin: 0.7rem 0 0; padding-top: 0.6rem; font-size: 0.82rem; opacity: 0.72;
      border-top: 1px solid rgba(232, 223, 200, 0.16);
    }
    #orders-board .hands em { color: #e8c98a; font-style: normal; }
    #orders-board .word { margin: 0.45rem 0 0; font-size: 0.85rem; color: #e0a17e; min-height: 1.1em; }
    #orders-board .hurt { margin: 0.4rem 0 0; font-size: 0.82rem; line-height: 1.5; }
    #orders-board .hurt .strain { display: block; color: #e8c98a; }
    #orders-board .hurt .lost { display: block; color: #d9776a; margin-top: 0.25rem; }
    #canvas-board .state.lost { color: #d9776a; }
    #instruments .warn { color: #e8c98a; opacity: 1; }
    #clock-board .held-back { color: #e8c98a; }

    #track-board dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 0.15rem 0.9rem; }
    #track-board dt {
      font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
      opacity: 0.5; align-self: baseline;
    }
    #track-board dd { margin: 0; font-size: 0.9rem; text-align: right; }

    #landfall {
      position: fixed; inset: 0; margin: auto;
      width: min(30rem, calc(100vw - 3rem)); height: fit-content;
      padding: 1.8rem 2rem;
      background: rgba(10, 22, 30, 0.93);
      border: 1px solid rgba(232, 223, 200, 0.3);
      pointer-events: none;
    }
    #landfall h2 {
      margin: 0 0 0.9rem; font-size: 0.72rem; font-weight: normal;
      letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.55;
    }
    #landfall .took { margin: 0 0 1.1rem; font-size: 1.15rem; line-height: 1.5; }
    #landfall dl { margin: 0 0 1.1rem; display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 1.2rem; }
    #landfall dt { font-size: 0.86rem; opacity: 0.62; }
    #landfall dd { margin: 0; font-size: 0.95rem; text-align: right; }
    #landfall p { margin: 0 0 0.8rem; font-size: 0.92rem; line-height: 1.55; }
    #landfall .again { margin: 0; font-size: 0.8rem; opacity: 0.45; }

    /* --- the glossary ----------------------------------------------------- */

    /* The boards let the mouse through so you can drag to look about her.
       Only the terms themselves catch it. */
    .term {
      pointer-events: auto; cursor: help;
      border-bottom: 1px dotted rgba(143, 208, 232, 0.5);
    }
    .term:hover { color: #8fd0e8; border-bottom-color: #8fd0e8; }

    #gloss {
      position: fixed; z-index: 10; width: min(21rem, calc(100vw - 2rem));
      padding: 0.7rem 0.9rem;
      background: rgba(10, 22, 30, 0.95);
      border: 1px solid rgba(143, 208, 232, 0.45);
      pointer-events: none; user-select: none;
    }
    #gloss h4 {
      margin: 0 0 0.35rem; font-size: 0.94rem; font-weight: normal;
      color: #cfe7f2; letter-spacing: 0.02em;
    }
    #gloss p { margin: 0; font-size: 0.86rem; line-height: 1.5; opacity: 0.85; }

    /* A board the hovered term is pointing at. */
    .board.lit {
      border-color: rgba(143, 208, 232, 0.85);
      background: rgba(16, 38, 50, 0.8);
    }

    #orders-card {
      position: fixed; inset: 0; margin: auto; z-index: 9;
      width: min(34rem, calc(100vw - 3rem)); height: fit-content;
      max-height: calc(100vh - 3rem); overflow-y: auto;
      padding: 1.5rem 1.8rem;
      background: rgba(10, 22, 30, 0.95);
      border: 1px solid rgba(232, 223, 200, 0.3);
      user-select: none;
    }
    #orders-card h2 {
      margin: 0 0 0.9rem; font-size: 0.7rem; font-weight: normal;
      letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.55;
    }
    #orders-card table { border-collapse: collapse; width: 100%; }
    #orders-card td { padding: 0.3rem 0; vertical-align: top; }
    #orders-card .k {
      width: 4.2rem; color: #8fd0e8; font-size: 0.86rem; white-space: nowrap;
    }
    #orders-card .w { width: 8rem; font-size: 0.92rem; }
    #orders-card .d { font-size: 0.82rem; opacity: 0.72; line-height: 1.55; }
    #orders-card .note {
      margin: 1rem 0 0; padding-top: 0.8rem; font-size: 0.84rem; line-height: 1.7;
      opacity: 0.8; border-top: 1px solid rgba(232, 223, 200, 0.16);
    }
    #orders-card .shut { margin: 0.7rem 0 0; font-size: 0.75rem; opacity: 0.4; }

    #stores-board dl {
      margin: 0; display: grid; grid-template-columns: auto auto; gap: 0.16rem 1.1rem;
    }
    #stores-board dt {
      font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase;
      opacity: 0.5; align-self: baseline;
    }
    #stores-board dd { margin: 0; font-size: 0.86rem; text-align: right; }
    #stores-board dd.low { color: #e8c98a; }
    #stores-board dd.out { color: #e8a08a; }
    #stores-board .short {
      margin: 0.5rem 0 0; font-size: 0.78rem; color: #e8c98a; max-width: 12rem;
    }
    #stores-board .short:empty { display: none; }

    /* --- the watch bill --------------------------------------------------- */

    #watch-bill {
      position: fixed; inset: 0; margin: auto; z-index: 9;
      width: min(62rem, calc(100vw - 3rem)); height: fit-content;
      max-height: calc(100vh - 3rem); overflow-y: auto;
      padding: 1.5rem 1.8rem;
      background: rgba(10, 22, 30, 0.95);
      border: 1px solid rgba(232, 223, 200, 0.3);
    }
    #watch-bill h2 {
      margin: 0 0 1rem; font-size: 0.7rem; font-weight: normal;
      letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.55;
    }
    #watch-bill .watches { display: flex; gap: 1.8rem; align-items: flex-start; }
    #watch-bill .watch { flex: 1; min-width: 0; opacity: 0.5; }
    #watch-bill .watch.up, #watch-bill .watch.idlers { opacity: 1; }
    #watch-bill .post.set { color: #8fd0e8; opacity: 0.95; }
    #watch-bill h3 {
      margin: 0 0 0.5rem; font-size: 0.92rem; font-weight: normal;
      text-transform: capitalize; color: #cfe7f2;
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid rgba(232, 223, 200, 0.16); padding-bottom: 0.35rem;
    }
    #watch-bill .where {
      font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.5;
    }
    #watch-bill table { border-collapse: collapse; width: 100%; }
    #watch-bill td { padding: 0.16rem 0; vertical-align: baseline; font-size: 0.84rem; }
    #watch-bill .who { width: 42%; }
    #watch-bill .rate { width: 30%; font-size: 0.76rem; opacity: 0.62; }
    #watch-bill .post { font-size: 0.76rem; opacity: 0.5; }
    #watch-bill .name {
      cursor: text; border-bottom: 1px dotted rgba(232, 223, 200, 0.2);
      display: inline-block; min-width: 5rem;
    }
    #watch-bill .name:hover { border-bottom-color: rgba(143, 208, 232, 0.7); }
    #watch-bill .name:focus {
      outline: none; color: #8fd0e8; border-bottom-color: #8fd0e8;
    }
    #watch-bill .tally {
      margin: 0.5rem 0 0; font-size: 0.72rem; letter-spacing: 0.12em;
      text-transform: uppercase; opacity: 0.4;
    }
    #watch-bill .note {
      margin: 1.2rem 0 0; padding-top: 0.8rem; font-size: 0.82rem; line-height: 1.7;
      opacity: 0.72; border-top: 1px solid rgba(232, 223, 200, 0.16);
    }

    #right {
      position: fixed; top: 1.1rem; right: 1.1rem;
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.7rem;
      pointer-events: none;
    }
    #right > * { position: static; }

    #clock-board { text-align: right; }
    #clock-board .time { font-size: 1.8rem; letter-spacing: 0.06em; line-height: 1.1; }
    #clock-board .watch { font-size: 0.84rem; opacity: 0.66; line-height: 1.5; margin-top: 0.2rem; }
    #clock-board .pace {
      margin-top: 0.55rem; padding-top: 0.5rem; font-size: 0.8rem; opacity: 0.6;
      border-top: 1px solid rgba(232, 223, 200, 0.16);
    }
    #clock-board .pace.paused { color: #e8c98a; opacity: 0.95; }

    #instruments { display: flex; align-items: center; gap: 1rem; }
    #instruments dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 0.15rem 0.9rem; }
    #instruments dt {
      font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
      opacity: 0.5; align-self: baseline;
    }
    #instruments dd { margin: 0; font-size: 0.9rem; max-width: 11.5rem; }
    #instruments dd.stalled { color: #e0a17e; }
    .dial-face { fill: rgba(232, 223, 200, 0.05); stroke: rgba(232, 223, 200, 0.3); stroke-width: 1.5; }
    .dial-north { stroke: rgba(232, 223, 200, 0.55); stroke-width: 2.5; }
    .dial-hull { fill: rgba(232, 223, 200, 0.72); }
    .arrow-shaft { stroke: #7fc0d8; stroke-width: 3; }
    .arrow-head { fill: #7fc0d8; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="right"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

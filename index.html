<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship</title>
  <style>
    html, body { height: 100%; margin: 0; background: #1d3b4f; overflow: hidden; }
    canvas { display: block; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #e8dfc8;
    }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 1.4rem;
      text-align: center; pointer-events: none;
      font-size: 0.95rem; letter-spacing: 0.05em; opacity: 0.55;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    #canvas-panel {
      position: fixed; top: 1.2rem; left: 1.2rem;
      padding: 0.85rem 1.1rem 0.7rem;
      background: rgba(12, 26, 34, 0.62);
      border: 1px solid rgba(232, 223, 200, 0.22);
      user-select: none; pointer-events: none;
    }
    #canvas-panel h2 {
      margin: 0 0 0.5rem; font-size: 0.72rem; font-weight: normal;
      letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.6;
    }
    #canvas-panel table { border-collapse: collapse; font-size: 0.92rem; }
    #canvas-panel td { padding: 0.12rem 0 0.12rem 0; }
    #canvas-panel .name { padding-right: 1.4rem; }
    #canvas-panel .state { padding-right: 1.4rem; color: #cfe3c8; }
    #canvas-panel .state.reefed { color: #e8c98a; }
    #canvas-panel .state.furled { color: #9aa6ac; }
    #canvas-panel .key { opacity: 0.45; font-size: 0.8rem; }
    #canvas-panel .note {
      margin: 0.7rem 0 0; font-size: 0.78rem; opacity: 0.5; line-height: 1.5;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hint">Drag to look about her &mdash; scroll to come closer</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

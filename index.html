<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship</title>
  <style>
    /* Her papers. Everything you read is on paper laid over the view: aged
       stock, iron-gall ink, small capitals for the headings. Nothing on the
       page is a picture file -- the sails and the compass are drawn as SVG. */
    :root {
      --paper:  #f0e7d3;
      --paper2: #e6dbc2;
      --ink:    #33291d;
      --faint:  #7c6b51;
      --rule:   rgba(80, 62, 38, 0.28);
      --edge:   rgba(60, 46, 28, 0.42);
      --blue:   #2c586e;
      --rust:   #9a4c32;
      --warn:   #9a6b1e;
    }

    html, body { height: 100%; margin: 0; background: #1d3b4f; overflow: hidden; }
    canvas { display: block; }
    body { font-family: Georgia, "Times New Roman", serif; color: var(--ink); }

    .board {
      position: fixed;
      padding: 0.75rem 0.95rem;
      background: linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
      border: 1px solid var(--edge);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.32);
      user-select: none; pointer-events: none;
    }
    .board h2 {
      margin: 0 0 0.55rem; font-size: 0.68rem; font-weight: normal;
      letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint);
    }
    .board h3 {
      margin: 0 0 0.15rem; font-size: 0.6rem; font-weight: normal;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint);
    }
    .board .rule { height: 1px; background: var(--rule); margin: 0.55rem 0; }

    /* --- the sail plan ------------------------------------------------------ */

    #canvas-board { top: 1.1rem; left: 1.1rem; }
    #canvas-board table { border-collapse: collapse; }
    #canvas-board th, #canvas-board td { padding: 0.05rem 0.1rem; }
    #canvas-board thead th {
      font-size: 0.56rem; font-weight: normal; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--faint); padding-bottom: 0.3rem;
    }
    #canvas-board .tier {
      text-align: left; font-weight: normal; font-size: 0.82rem;
      padding-right: 0.7rem; white-space: nowrap;
    }
    #canvas-board .cell { width: 2.1rem; text-align: center; }
    #canvas-board .key {
      font-size: 0.68rem; color: var(--faint); padding-left: 0.6rem; text-align: right;
    }
    #canvas-board .states {
      margin: 0.6rem 0 0; padding-top: 0.5rem; border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between; gap: 0.2rem;
    }
    #canvas-board .states span { text-align: center; }
    #canvas-board .states i {
      display: block; font-style: normal; font-size: 0.56rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
    }
    #canvas-board .states .sail { width: 1.75rem; height: 1.3rem; }

    #canvas-board .legend {
      margin: 0.6rem 0 0; padding-top: 0.5rem; border-top: 1px solid var(--rule);
      font-size: 0.68rem; line-height: 1.75; color: var(--faint);
    }
    #canvas-board .legend b { color: var(--ink); font-weight: normal; }

    .sail { width: 1.9rem; height: 1.4rem; display: block; margin: 0 auto; }
    .sail .yard { stroke: #6b5636; stroke-width: 1.1; stroke-linecap: round; fill: none; }
    .sail .cloth { fill: #fbf6ea; stroke: #6f5c40; stroke-width: 0.7; stroke-linejoin: round; }
    .sail .cloth.furl { fill: #cbbb9c; stroke: #6f5c40; stroke-width: 0.7; }
    .sail .reef { stroke: #8a7050; stroke-width: 0.95; stroke-linecap: round; }
    .sail.furled .cloth { fill: #c3b294; }
    .sail.working .cloth { fill: #dfe9ea; stroke: var(--blue); }
    .sail.working .yard { stroke: var(--blue); }
    .sail .tear { stroke: var(--rust); stroke-width: 1.3; stroke-linecap: round; }
    .sail.gone .yard { stroke: #b09a7c; }

    /* --- the orders in hand -------------------------------------------------- */

    #orders-board {
      bottom: 1.1rem; left: 1.1rem; width: 23rem;
      max-height: 56vh; overflow-y: auto;
    }
    #orders-board ul { margin: 0; padding: 0; list-style: none; }
    #orders-board li {
      display: grid; grid-template-columns: 1.5rem 1fr auto; gap: 0.1rem 0.55rem;
      align-items: baseline; margin-bottom: 0.5rem;
    }
    #orders-board li.idle { display: block; color: var(--faint); font-size: 0.86rem; }
    #orders-board li.held { opacity: 0.62; }
    #orders-board .ring { grid-row: span 2; align-self: center; }
    #orders-board .ring svg { width: 1.35rem; height: 1.35rem; transform: rotate(-90deg); }
    #orders-board .ring .track { fill: none; stroke: var(--rule); stroke-width: 2.4; }
    #orders-board .ring .done {
      fill: none; stroke: var(--blue); stroke-width: 2.4; stroke-linecap: round;
    }
    #orders-board .what { font-size: 0.88rem; line-height: 1.35; }
    #orders-board .what em {
      display: block; font-style: normal; font-size: 0.7rem; color: var(--faint);
    }
    #orders-board .left {
      font-size: 0.82rem; color: var(--faint); font-variant-numeric: tabular-nums;
    }
    #orders-board .post {
      grid-column: 2 / -1; font-size: 0.7rem; line-height: 1.45; color: var(--faint);
    }
    #orders-board .post b { font-weight: normal; color: var(--blue); }
    #orders-board .hands {
      margin: 0.65rem 0 0; padding-top: 0.55rem; font-size: 0.8rem; line-height: 1.55;
      border-top: 1px solid var(--rule);
    }
    #orders-board .hands b { font-weight: normal; font-size: 0.95rem; }
    #orders-board .hands em { color: var(--rust); font-style: normal; }
    #orders-board .hands em.fit { color: var(--blue); }
    #orders-board .chase { margin: 0.45rem 0 0; font-size: 0.83rem; line-height: 1.5; color: var(--blue); }
    #orders-board .chase:empty, #orders-board .hurt:empty, #orders-board .word:empty { display: none; }
    #orders-board .hurt { margin: 0.4rem 0 0; font-size: 0.8rem; line-height: 1.5; }
    #orders-board .hurt .strain { display: block; color: var(--warn); }
    #orders-board .hurt .lost { display: block; color: var(--rust); margin-top: 0.2rem; }
    #orders-board .word { margin: 0.45rem 0 0; font-size: 0.83rem; color: var(--rust); }

    /* --- the right-hand column ---------------------------------------------- */

    #right {
      position: fixed; top: 1.1rem; right: 1.1rem;
      display: flex; flex-direction: column; align-items: stretch; gap: 0.65rem;
      width: 12.5rem; pointer-events: none;
    }
    #right > * { position: static; }

    #clock-board { text-align: center; }
    #clock-board .time {
      font-size: 2rem; letter-spacing: 0.04em; line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    #clock-board .watch {
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--faint); margin-top: 0.25rem;
    }
    #clock-board .bell { font-size: 0.8rem; font-style: italic; color: var(--faint); }
    #clock-board h3 { text-align: center; }
    #clock-board .wind, #clock-board .head { font-size: 0.9rem; line-height: 1.35; }
    #clock-board .speed { font-size: 0.9rem; }
    #clock-board .from { font-size: 0.76rem; color: var(--faint); }
    #clock-board .pace {
      margin-top: 0.6rem; padding-top: 0.5rem; font-size: 0.74rem; color: var(--faint);
      border-top: 1px solid var(--rule);
    }
    #clock-board .pace.paused { color: var(--warn); }
    #clock-board .held-back { color: var(--warn); }

    #voyage-board .task {
      margin: 0 0 0.6rem; font-size: 0.86rem; line-height: 1.5;
      padding-bottom: 0.55rem; border-bottom: 1px solid var(--rule);
    }

    #track-board dl, #stores-board dl, #voyage-board dl {
      margin: 0; display: grid; grid-template-columns: auto auto; gap: 0.18rem 0.7rem;
    }
    #track-board dt, #stores-board dt, #voyage-board dt {
      font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--faint); align-self: baseline;
    }
    #track-board dd, #stores-board dd, #voyage-board dd {
      margin: 0; font-size: 0.84rem; text-align: right; font-variant-numeric: tabular-nums;
    }
    #stores-board dd.low { color: var(--warn); }
    #stores-board dd.out { color: var(--rust); }
    #stores-board .short { margin: 0.5rem 0 0; font-size: 0.76rem; color: var(--warn); }
    #stores-board .short:empty { display: none; }

    /* --- the compass rose ---------------------------------------------------- */

    #rose {
      position: fixed; right: 1.4rem; bottom: 1.4rem;
      width: 9.5rem; text-align: center;
      user-select: none; pointer-events: none;
    }
    #rose .rose { width: 100%; height: auto; display: block; }
    #rose .rim { fill: #c9a86a; stroke: #6b5029; stroke-width: 2.5; }
    #rose .face { fill: #f0e7d3; stroke: #8a7145; stroke-width: 1; }
    #rose .ticks line { stroke: #8a7145; stroke-width: 0.9; }
    #rose .ticks line.cardinal { stroke: #4a3a1e; stroke-width: 1.6; }
    #rose .letter {
      font-size: 8px; fill: #4a3a1e; text-anchor: middle;
      font-family: Georgia, serif; letter-spacing: 0.05em;
    }
    #rose .needle .north { fill: var(--rust); }
    #rose .needle .south { fill: #3d3527; }
    #rose .pin { fill: #6b5029; }
    #rose .wind path { fill: var(--blue); opacity: 0.85; }
    #rose .squall {
      margin: 0.3rem 0 0; font-size: 0.74rem; line-height: 1.4; color: #f0e7d3;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }
    #rose .squall:empty { display: none; }

    /* --- the command bar ----------------------------------------------------- */

    /* Anchored along the bottom, the way a real-time strategy game does it: her
       state on the left, the orders themselves as a card of buttons. */
    #command {
      position: fixed; z-index: 8;
      left: 0; right: 0; bottom: 0;
      display: flex; align-items: stretch; gap: 0.9rem;
      padding: 0.5rem 0.9rem;
      background: linear-gradient(0deg, var(--paper2) 0%, var(--paper) 100%);
      border-top: 1px solid var(--edge);
      box-shadow: 0 -3px 18px rgba(0, 0, 0, 0.35);
      user-select: none;
    }

    #command .her {
      flex: 0 0 11rem;
      display: grid; grid-template-columns: auto 1fr; gap: 0.1rem 0.6rem;
      align-content: center;
      padding-right: 0.9rem; border-right: 1px solid var(--rule);
    }
    #command .her .tag {
      font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--faint); align-self: center;
    }
    #command .her b {
      font-weight: normal; font-size: 0.92rem; text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #command .her em { font-style: normal; color: var(--faint); font-size: 0.76rem; }

    #command .card { flex: 1; display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    #command .row { display: flex; align-items: center; gap: 0.6rem; }
    #command .rowname {
      flex: 0 0 4.6rem; font-size: 0.58rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--faint); text-align: right;
    }
    /* Rows never wrap: the bar stays three rows tall on any window, and a
       narrow one scrolls its cards sideways instead of growing upward. */
    #command .cards {
      display: flex; gap: 0.3rem; flex-wrap: nowrap;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
    }

    #command .ord {
      position: relative; font-family: inherit; cursor: pointer;
      flex: 0 0 auto; min-width: 5.4rem; padding: 0.32rem 0.5rem 0.3rem;
      background: rgba(80, 62, 38, 0.06); color: var(--ink);
      border: 1px solid var(--edge); border-radius: 2px;
      display: flex; align-items: center; gap: 0.35rem;
    }
    #command .ord:hover { border-color: var(--blue); background: rgba(44, 88, 110, 0.14); }
    #command .ord:active { transform: translateY(1px); background: var(--blue); color: var(--paper); }
    #command .ord .what { font-size: 0.76rem; white-space: nowrap; }
    #command .ord .badge {
      font-size: 0.56rem; letter-spacing: 0.04em; color: var(--paper);
      background: var(--faint); border-radius: 2px;
      min-width: 1.05rem; padding: 0.05rem 0.16rem; text-align: center;
    }
    #command .ord:hover .badge { background: var(--blue); }
    #command .ord .glyph { margin-left: auto; }
    #command .ord .glyph:empty { display: none; }
    #command .ord .glyph .sail { width: 1.35rem; height: 1rem; margin: 0; }

    /* An order that would do nothing looks like it would do nothing. */
    #command .ord.spent { opacity: 0.38; cursor: default; }
    #command .ord.spent:hover { border-color: var(--edge); background: rgba(80, 62, 38, 0.06); }
    #command .ord.busy { border-color: var(--blue); }

    /* Everything else keeps off the bar. */
    #orders-board { bottom: 9.5rem !important; max-height: 40vh !important; }
    #pilot { bottom: 9.9rem !important; }
    #rose { bottom: 9.9rem !important; }
    #glass { bottom: 9.9rem !important; }

    /* --- the pilot: one step at a time --------------------------------------- */

    #pilot {
      position: fixed; z-index: 10;
      bottom: 1.1rem; left: 50%; transform: translateX(-50%);
      width: min(38rem, calc(100vw - 26rem));
      padding: 1rem 1.3rem 0.9rem;
      background: linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
      border: 1px solid var(--edge);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
      pointer-events: auto; user-select: none;
    }
    #pilot .tally {
      margin: 0 0 0.5rem; font-size: 0.58rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--faint);
    }
    #pilot .say { margin: 0; font-size: 1rem; line-height: 1.6; }
    #pilot .how {
      margin: 0.6rem 0 0; font-size: 0.86rem; color: var(--blue); font-style: italic;
    }
    #pilot .how:empty, #pilot .well:empty, #pilot .acts:empty { display: none; }
    #pilot .acts { margin: 0.9rem 0 0; display: flex; flex-wrap: wrap; gap: 0.6rem; }
    #pilot .act {
      font-family: inherit; font-size: 0.95rem; color: var(--blue);
      background: rgba(44, 88, 110, 0.06); cursor: pointer;
      border: 1px solid var(--edge); border-radius: 2px;
      padding: 0.6rem 1.1rem; flex: 1 1 auto; min-width: 9rem;
    }
    #pilot .act:hover { border-color: var(--blue); background: rgba(44, 88, 110, 0.13); }
    #pilot .act.down {
      background: var(--blue); color: var(--paper); border-color: var(--blue);
      transform: translateY(2px); box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    /* The closing gauge. Her head walks in from the side; when she is near
       enough the whole bar goes solid, which says "that is right" without
       anybody having to write it down. */
    #pilot .gauge { margin: 0.9rem 0 0; display: none; align-items: center; gap: 0.8rem; }
    #pilot .gauge:not(:empty) { display: flex; }
    #pilot .gauge .track {
      position: relative; flex: 1; height: 1.5rem;
      border: 1px solid var(--rule); border-radius: 2px;
      background: rgba(80, 62, 38, 0.05);
    }
    #pilot .gauge .notch {
      position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px;
      margin-left: -1px; background: var(--rust);
    }
    #pilot .gauge .needle {
      position: absolute; top: 2px; bottom: 2px; width: 0.55rem; margin-left: -0.27rem;
      background: var(--blue); border-radius: 1px;
      transition: left 0.12s linear;
    }
    #pilot .gauge .reads {
      font-size: 0.78rem; color: var(--faint); min-width: 7.5rem; text-align: right;
    }
    #pilot .gauge.near .track { border-color: var(--blue); background: rgba(44, 88, 110, 0.16); }
    #pilot .gauge.near .needle { background: var(--blue); box-shadow: 0 0 0 3px rgba(44, 88, 110, 0.3); }
    #pilot .gauge.near .reads {
      color: var(--blue); font-size: 0.86rem; letter-spacing: 0.04em;
    }

    #pilot .well {
      margin: 0.7rem 0 0; font-size: 1.06rem; line-height: 1.5; color: var(--rust);
    }
    #pilot .well .tick {
      display: inline-block; margin-right: 0.5rem; font-size: 1.2rem;
      color: var(--paper); background: var(--rust);
      width: 1.5rem; height: 1.5rem; line-height: 1.5rem; text-align: center;
      border-radius: 50%; vertical-align: -0.25rem;
      animation: stamp 0.45s cubic-bezier(0.2, 1.5, 0.4, 1) both;
    }
    @keyframes stamp {
      from { transform: scale(0.1) rotate(-25deg); opacity: 0; }
      to   { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* A step landing, and a step arriving. */
    #pilot.done {
      border-color: var(--rust);
      box-shadow: 0 0 0 3px rgba(154, 76, 50, 0.25), 0 6px 30px rgba(0, 0, 0, 0.45);
    }
    #pilot.fresh { animation: nudge 0.6s ease-out both; }
    @keyframes nudge {
      0%   { transform: translateX(-50%) translateY(10px); opacity: 0.4; }
      100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    #pilot .shut {
      margin-top: 0.8rem; font-family: inherit; font-size: 0.68rem;
      letter-spacing: 0.1em; color: var(--faint); background: none;
      border: none; padding: 0; cursor: pointer;
    }
    #pilot .shut:hover { color: var(--rust); }

    /* With the pilot up, the orders board keeps out of its way. */
    #pilot ~ #orders-board, #orders-board { max-height: 44vh; }

    /* --- the shipping office ------------------------------------------------- */

    #office .preamble { color: var(--faint); font-size: 0.88rem; }
    #office .berth { margin: 1.4rem 0 0; padding: 0; list-style: none; }
    #office .berth li {
      display: grid; grid-template-columns: 1.6rem 1fr auto;
      gap: 0.1rem 0.4rem; align-items: baseline;
      padding: 0.6rem 0; border-top: 1px solid var(--rule);
    }
    #office .mark { color: var(--blue); font-size: 0.95rem; }
    #office .berth .link { justify-self: start; text-align: left; font-size: 1.02rem; }
    #office .teaches {
      grid-column: 2 / -1; font-size: 0.78rem; line-height: 1.5; color: var(--faint);
    }
    #office .cue {
      font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--rust); align-self: center;
    }
    #office li.done .link { color: var(--faint); border-bottom-color: transparent; }
    #office li.done .link:hover { color: var(--rust); }
    #office .note {
      margin: 1.2rem 0 0; padding-top: 0.9rem; font-size: 0.76rem;
      color: var(--faint); border-top: 1px solid var(--rule);
    }

    /* --- the owners' letter, and the account of a short voyage --------------- */

    #office, #letter, #voyage-done {
      position: fixed; inset: 0; margin: auto; z-index: 12;
      width: min(33rem, calc(100vw - 3rem)); height: fit-content;
      max-height: calc(100vh - 3rem); overflow-y: auto;
      padding: 2rem 2.3rem;
      background: linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
      border: 1px solid var(--edge);
      box-shadow: 0 6px 34px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }
    #office h2, #letter h2, #voyage-done h2 {
      margin: 0 0 1.1rem; font-size: 0.68rem; font-weight: normal;
      letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint);
    }
    #letter h3 {
      margin: 1.5rem 0 0.6rem; font-size: 0.62rem; font-weight: normal;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint);
      border-top: 1px solid var(--rule); padding-top: 0.9rem;
    }
    #letter p { margin: 0 0 0.9rem; font-size: 0.95rem; line-height: 1.7; }
    #letter .dateline {
      font-style: italic; color: var(--faint); font-size: 0.85rem; text-align: right;
    }
    #letter .keys { margin: 0; padding: 0; list-style: none; }
    #letter .keys li { font-size: 0.84rem; line-height: 1.9; color: var(--faint); }
    #letter .keys b { font-weight: normal; color: var(--blue); }
    #letter .other, #voyage-done .mate { font-size: 0.84rem; color: var(--faint); }
    #voyage-done .mate { font-style: italic; line-height: 1.6; }
    #letter .go, #voyage-done .go { margin: 1.4rem 0 0.7rem; }

    #office button, #letter button, #voyage-done button {
      font-family: inherit; color: var(--blue); background: none; cursor: pointer;
      border: none; padding: 0; font-size: inherit;
      border-bottom: 1px solid rgba(44, 88, 110, 0.5);
    }
    #office button:hover, #letter button:hover, #voyage-done button:hover { color: var(--rust); border-bottom-color: var(--rust); }
    #letter .sail {
      font-size: 1.15rem; letter-spacing: 0.18em; text-transform: uppercase;
      border: 1px solid var(--edge); padding: 0.55rem 1.9rem;
    }
    /* The next voyage carries its whole name, so it is set at reading size
       rather than in the Sail button's capitals. */
    #voyage-done .on {
      font-size: 0.98rem; border: 1px solid var(--edge); padding: 0.5rem 1.3rem;
    }
    #letter .sail:hover, #voyage-done .on:hover { border-color: var(--rust); }

    #voyage-done .home { font-size: 1.1rem; margin: 0 0 1.1rem; }
    #voyage-done dl { margin: 0 0 1.1rem; display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 1.2rem; }
    #voyage-done dt { font-size: 0.84rem; color: var(--faint); }
    #voyage-done dd { margin: 0; font-size: 0.92rem; text-align: right; }
    #voyage-done p { margin: 0 0 0.8rem; font-size: 0.9rem; line-height: 1.55; }
    #voyage-done dd .through {
      display: block; font-size: 0.74rem; color: var(--faint); font-style: italic;
    }

    /* --- the account at the end ---------------------------------------------- */

    #landfall {
      position: fixed; inset: 0; margin: auto;
      width: min(32rem, calc(100vw - 3rem)); height: fit-content;
      max-height: calc(100vh - 3rem); overflow-y: auto;
      padding: 1.8rem 2rem;
      background: linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
      border: 1px solid var(--edge);
      box-shadow: 0 6px 34px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }
    #landfall h2 {
      margin: 0 0 0.9rem; font-size: 0.7rem; font-weight: normal;
      letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint);
    }
    #landfall h3 {
      margin: 1.3rem 0 0.6rem; font-size: 0.64rem; font-weight: normal;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint);
      border-top: 1px solid var(--rule); padding-top: 0.9rem;
    }
    #landfall .took { margin: 0 0 1.1rem; font-size: 1.1rem; line-height: 1.5; }
    #landfall dl { margin: 0 0 1.1rem; display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 1.2rem; }
    #landfall dt { font-size: 0.84rem; color: var(--faint); }
    #landfall dd { margin: 0; font-size: 0.92rem; text-align: right; }
    #landfall p { margin: 0 0 0.8rem; font-size: 0.9rem; line-height: 1.55; }
    #landfall .toll { color: var(--rust); }
    #landfall .again { margin: 0; font-size: 0.78rem; color: var(--faint); }
    #landfall .roll { margin: 0 0 1rem; padding: 0; list-style: none; font-size: 0.84rem; }
    #landfall .roll li { margin-bottom: 0.3rem; line-height: 1.45; }
    #landfall .roll li.lost { opacity: 0.55; }
    #landfall .roll b { font-weight: normal; }
    #landfall .roll em { color: var(--rust); font-style: normal; }
    #landfall .roll span { display: block; font-size: 0.77rem; color: var(--faint); }

    /* --- the glossary --------------------------------------------------------- */

    /* The boards let the mouse through so you can drag to look about her.
       Only the terms themselves catch it. */
    .term {
      pointer-events: auto; cursor: help;
      border-bottom: 1px dotted rgba(44, 88, 110, 0.55);
    }
    .term:hover { color: var(--blue); border-bottom-color: var(--blue); }

    /* Above the letter and the office: a definition you cannot read is no
       definition at all. */
    #gloss, #man {
      position: fixed; z-index: 20;
      padding: 0.7rem 0.9rem;
      background: linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
      border: 1px solid var(--edge);
      box-shadow: 0 3px 18px rgba(0, 0, 0, 0.4);
      pointer-events: none; user-select: none;
    }
    #gloss { width: min(21rem, calc(100vw - 2rem)); }
    #man { width: 14rem; }
    #gloss h4, #man h4 {
      margin: 0 0 0.3rem; font-size: 0.92rem; font-weight: normal; color: var(--blue);
    }
    #gloss p, #man p { margin: 0; font-size: 0.84rem; line-height: 1.5; }
    #man p { font-size: 0.78rem; color: var(--faint); }
    #man em { color: var(--rust); font-style: normal; }

    /* A board the glossary or the pilot is pointing at. It breathes, because a
       still outline on a page of still outlines is not a pointing finger. */
    .board.lit {
      border-color: var(--blue);
      animation: pointing 1.5s ease-in-out infinite;
    }
    /* The compass is not a board, but the pilot points at it all the same. */
    #rose.lit { border-radius: 50%; animation: pointing 1.5s ease-in-out infinite; }
    @keyframes pointing {
      0%, 100% { box-shadow: 0 0 0 2px rgba(44, 88, 110, 0.22), 0 2px 14px rgba(0, 0, 0, 0.32); }
      50%      { box-shadow: 0 0 0 6px rgba(44, 88, 110, 0.42), 0 2px 14px rgba(0, 0, 0, 0.32); }
    }

    /* --- the sheets: orders, the watch bill, the glass ----------------------- */

    #orders-card, #watch-bill, #glass {
      position: fixed; z-index: 9; height: fit-content;
      max-height: calc(100vh - 3rem); overflow-y: auto;
      padding: 1.4rem 1.7rem;
      background: linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
      border: 1px solid var(--edge);
      box-shadow: 0 6px 34px rgba(0, 0, 0, 0.45);
      user-select: none;
    }
    #orders-card { inset: 0; margin: auto; width: min(34rem, calc(100vw - 3rem)); }
    #watch-bill { inset: 0; margin: auto; width: min(62rem, calc(100vw - 3rem)); }
    #glass {
      bottom: 1.1rem; left: 50%; transform: translateX(-50%);
      width: min(24rem, calc(100vw - 2rem)); pointer-events: auto;
    }
    #orders-card h2, #watch-bill h2, #glass h2 {
      margin: 0 0 0.9rem; font-size: 0.68rem; font-weight: normal;
      letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint);
    }
    #orders-card table { border-collapse: collapse; width: 100%; }
    #orders-card td { padding: 0.3rem 0; vertical-align: top; }
    #orders-card .k { width: 4.2rem; color: var(--blue); font-size: 0.85rem; white-space: nowrap; }
    #orders-card .w { width: 8rem; font-size: 0.9rem; }
    #orders-card .d { font-size: 0.8rem; color: var(--faint); line-height: 1.55; }
    #orders-card .note, #watch-bill .note {
      margin: 1rem 0 0; padding-top: 0.8rem; font-size: 0.82rem; line-height: 1.7;
      color: var(--faint); border-top: 1px solid var(--rule);
    }
    #orders-card .note b, #watch-bill .note b { color: var(--ink); font-weight: normal; }
    #orders-card .shut, #glass .shut {
      margin: 0.7rem 0 0; font-size: 0.72rem; color: var(--faint);
    }

    /* --- the ship in section ------------------------------------------------- */

    #watch-bill .section { display: block; width: 100%; height: auto; }
    #watch-bill .section .hull { fill: rgba(80, 62, 38, 0.05); stroke: var(--edge); stroke-width: 1.4; }
    #watch-bill .section .room {
      fill: rgba(80, 62, 38, 0.07); stroke: var(--rule); stroke-width: 1;
    }
    #watch-bill .section .deck { stroke: var(--ink); stroke-width: 1.6; }
    #watch-bill .section .mast { stroke: var(--faint); stroke-width: 2.4; }
    #watch-bill .section .yard { stroke: var(--faint); stroke-width: 1.4; }
    #watch-bill .section .water {
      stroke: var(--blue); stroke-width: 1; stroke-dasharray: 7 5; opacity: 0.5;
    }
    #watch-bill .section .tag {
      font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
      fill: var(--faint); font-family: Georgia, serif;
    }
    #watch-bill .section .tally {
      font-size: 10px; fill: var(--faint); text-anchor: end; font-family: Georgia, serif;
    }
    #watch-bill .section .man { fill: var(--ink); cursor: help; }
    #watch-bill .section .man.hurt { fill: var(--rust); }
    #watch-bill .section .man:hover { fill: var(--blue); }

    #watch-bill .whois {
      margin: 0.5rem 0 0; padding: 0.5rem 0.7rem; min-height: 1.2rem;
      font-size: 0.86rem; color: var(--faint);
      background: rgba(80, 62, 38, 0.05); border: 1px solid var(--rule);
    }
    #watch-bill .whois b { font-weight: normal; color: var(--blue); }
    #watch-bill h2.bill {
      margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid var(--rule);
    }

    #watch-bill .watches {
      display: flex; gap: 1.8rem; align-items: flex-start; flex-wrap: wrap;
    }
    #watch-bill .watch { flex: 1 1 15rem; min-width: 15rem; opacity: 0.55; }
    #watch-bill .watch.up, #watch-bill .watch.idlers { opacity: 1; }
    #watch-bill h3 {
      margin: 0 0 0.5rem; font-size: 0.88rem; font-weight: normal;
      text-transform: capitalize; color: var(--blue);
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 1px solid var(--rule); padding-bottom: 0.35rem;
    }
    #watch-bill .where {
      font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint);
    }
    #watch-bill table { border-collapse: collapse; width: 100%; }
    #watch-bill td { padding: 0.15rem 0; vertical-align: baseline; font-size: 0.82rem; }
    #watch-bill .who { width: 42%; }
    #watch-bill .rate { width: 30%; font-size: 0.74rem; color: var(--faint); }
    /* A man's years. A whaleship was worked by boys, and the bill should say so. */
    #watch-bill .age {
      margin-left: 0.4rem; font-size: 0.7rem; color: var(--blue);
      font-variant-numeric: tabular-nums;
    }
    #watch-bill .post { font-size: 0.74rem; color: var(--faint); }
    #watch-bill .post.set { color: var(--blue); }
    #watch-bill .name {
      cursor: text; border-bottom: 1px dotted rgba(80, 62, 38, 0.3);
      display: inline-block; min-width: 5rem;
    }
    #watch-bill .name:hover { border-bottom-color: var(--blue); }
    #watch-bill .name:focus { outline: none; color: var(--blue); border-bottom-color: var(--blue); }
    #watch-bill .tally {
      margin: 0.5rem 0 0; font-size: 0.68rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--faint);
    }

    #glass label {
      display: grid; grid-template-columns: 6.4rem 1fr; gap: 0.1rem 0.7rem;
      align-items: center; margin-bottom: 0.55rem;
    }
    #glass .what { font-size: 0.8rem; color: var(--faint); }
    #glass .was { grid-column: 2; font-size: 0.76rem; color: var(--blue); }
    #glass input[type=range] { width: 100%; accent-color: var(--blue); background: transparent; margin: 0; }
    #glass .note {
      margin: 0.9rem 0 0; padding-top: 0.7rem; font-size: 0.77rem; line-height: 1.6;
      color: var(--faint); border-top: 1px solid var(--rule);
    }
    #glass .rate { margin: 0.6rem 0 0; font-size: 0.76rem; color: var(--faint); }
    #glass .rate.slow { color: var(--rust); }
  </style>

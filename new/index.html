<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whaler — new approach</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel" id="ship">
    <div class="title">The Mastiff</div>
    <div class="sub">Whaleship, three hundred tons</div>
    <div class="row"><span>Hold</span><b id="holdN"></b></div>
    <div class="bar hold"><i id="hProv" class="stores"></i><i id="hWhale" class="oil"></i><i id="hSperm" class="sperm"></i></div>
    <div class="key" id="holdKey"></div>
    <div class="row" id="storesRow"><span>Provisions</span><b id="storesN"></b></div>
    <div class="row"><span>Hull</span><b id="hullN"></b></div>
    <div class="bar"><i id="hullB"></i></div>
    <div class="row"><span>Crew</span><b id="crewN"></b></div>
    <div class="bar"><i id="crewB" class="crew"></i></div>
    <div class="row"><span>Boats</span><b id="boatsN"></b></div>
    <div class="row"><span>Spirits</span><b id="spiritsN"></b></div>
    <div class="bar"><i id="spiritsB"></i></div>
    <div class="kindness"><button id="duff" class="lesser small" hidden>Serve duff</button><button id="sunday" class="lesser small" hidden>Keep Sunday</button></div>
    <button id="openShip" class="lesser small">The ship ›</button>
  </div>

  <div class="panel" id="tally"></div>

  <div id="corner">
    <div class="panel" id="when"><div id="date"></div><div id="where"></div><div id="wind"></div></div>
    <canvas id="minimap" width="360" height="360"></canvas>
  </div>

  <div class="panel" id="objective">
    <div class="label">Current objective</div>
    <div id="goal"></div>
    <ul id="steps"></ul>
    <div id="hint"></div>
  </div>

  <div id="dock">
    <div class="panel" id="chase" hidden>
      <div id="chaseLabel"></div>
      <div class="bar" id="chaseBar"><i id="chaseB" class="oil"></i></div>
    </div>
    <div id="acts"><button id="act" hidden></button><button id="act2" class="lesser" hidden></button></div>
  </div>

  <div id="toast"></div>

  <div id="labels"></div>
  <div id="nameplate" hidden></div>
  <div class="panel" id="crewbar"></div>
  <div id="ghost" hidden></div>
  <div class="panel" id="roster">
    <div id="rosterTabs"><button data-tab="stations">Stations</button><button data-tab="company">Company</button><button data-tab="boats">Boats</button></div>
    <div id="rosterFx"></div>
    <div id="rosterBody"></div>
  </div>
  <div id="shipTop">
    <div class="who"><div class="title">The Mastiff</div><div id="deckName"></div></div>
    <div class="when"><div id="shipDate"></div><div id="watchLine"></div></div>
    <div class="how"><span id="shipMood"></span><button id="closeShip">Back to the sea</button></div>
  </div>
  <div id="shipbar">
    <div class="deckrow"><button id="prevDeck" class="lesser">‹</button><span id="deckTabs"></span><button id="nextDeck" class="lesser">›</button></div>
    <div class="legend">Rings at their feet: <i style="background:#4a78c0"></i>Larboard watch <i style="background:#c0553a"></i>Starboard watch <i style="background:#8a8070"></i>Officers and idlers
      <button id="runTime" class="lesser">Let time run</button> <button id="detailBtn" class="lesser">Show plain deck</button></div>
  </div>

  <div id="modal" hidden>
    <div class="panel">
      <div class="title" id="modalTitle"></div>
      <div id="summary"></div>
      <div id="choices"></div>
    </div>
  </div>

  <a id="back" href="../">‹ Versions</a>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
